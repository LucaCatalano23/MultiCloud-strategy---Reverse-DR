name: reverse-dr-poc

services:
  boundary-router:
    image: nginx:1.27-alpine
    container_name: boundary-router
    restart: unless-stopped
    volumes:
      - ./automazione/boundary-router/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./automazione/boundary-router/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "80:80"
    networks:
      rete-dipendenti:
        ipv4_address: 172.28.10.254
      rete-dmz:
        ipv4_address: 172.28.20.254
    depends_on:
      - datacenter-router

  boundary-router-egress:
    build:
      context: automazione/router-proxy
      dockerfile: Dockerfile
    container_name: boundary-router-egress
    restart: unless-stopped
    volumes:
      - ./automazione/router-proxy/boundary-squid.conf:/etc/squid/squid.conf:ro
    networks:
      rete-dipendenti:
        ipv4_address: 172.28.10.253
      rete-dmz:
        ipv4_address: 172.28.20.252
      rete-transito-cloud:

  datacenter-router:
    image: nginx:1.27-alpine
    container_name: datacenter-router
    restart: unless-stopped
    volumes:
      - ./automazione/datacenter-router/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./automazione/datacenter-router/conf.d:/etc/nginx/conf.d:ro
    networks:
      rete-dmz:
        ipv4_address: 172.28.20.253
      rete-datacenter:
        ipv4_address: 172.28.30.254
      # DOVREBBE ESSERCI LA RETE-TRANISTO-CLOUD

  datacenter-router-egress:
    build:
      context: automazione/router-proxy
      dockerfile: Dockerfile
    container_name: datacenter-router-egress
    restart: unless-stopped
    volumes:
      - ./automazione/router-proxy/datacenter-squid.conf:/etc/squid/squid.conf:ro
    networks:
      rete-dmz:
        ipv4_address: 172.28.20.251
      rete-datacenter:
        ipv4_address: 172.28.30.253
    depends_on:
      - boundary-router-egress

  boundary-dns-router:
    image: coredns/coredns:1.11.3
    container_name: boundary-dns-router
    restart: unless-stopped
    command: -conf /etc/coredns/Corefile
    volumes:
      - ./automazione/boundary-dns-router/Corefile:/etc/coredns/Corefile:ro
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    networks:
      rete-dipendenti:
        ipv4_address: 172.28.10.252
      rete-dmz:
        ipv4_address: 172.28.20.250
      rete-transito-cloud:

  datacenter-load-balancer:
    image: nginx:1.27-alpine
    container_name: datacenter-load-balancer
    restart: unless-stopped
    volumes:
      - ./automazione/datacenter-load-balancer/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./automazione/datacenter-load-balancer/conf.d:/etc/nginx/conf.d:ro
    networks:
      rete-datacenter:
        ipv4_address: 172.28.30.10

  identity-failover-controller:
    build:
      context: .
      dockerfile: automazione/identity/Dockerfile
    container_name: identity-failover-controller
    init: true
    restart: unless-stopped
    working_dir: /workspace
    command: ["python3", "/workspace/automazione/identity/identity_failover_controller.py"]
    environment:
      KUBECONFIG: /root/.kube/config
      IDENTITY_STATUS_PATH: /var/lib/identity/status.json
      IDENTITY_APPROVAL_PATH: /var/lib/identity/approve-entra.json
      IDENTITY_K8S_NAMESPACE: reverse-dr
      IDENTITY_K8S_DEPLOYMENT: reverse-dr-app
      ENTRA_ID_ISSUER_URL: ${ENTRA_ID_ISSUER_URL:-https://login.microsoftonline.com/common/v2.0}
      ENTRA_ID_HEALTH_URL: ${ENTRA_ID_HEALTH_URL:-https://login.microsoftonline.com/common/v2.0/.well-known/openid-configuration}
      ENTRA_ID_CLIENT_ID: ${ENTRA_ID_CLIENT_ID:-poc-entra-client}
      ENTRA_ID_CLIENT_SECRET: ${ENTRA_ID_CLIENT_SECRET:-poc-entra-secret}
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL:-http://keycloak-datacenter.reverse-dr.svc.cluster.local:8080/realms/master}
      KEYCLOAK_HEALTH_URL: http://keycloak:9000/health/ready
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-reverse-dr-app}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-poc-keycloak-secret}
      IDENTITY_CHECK_INTERVAL_SECONDS: ${IDENTITY_CHECK_INTERVAL_SECONDS:-10}
      IDENTITY_FAILURE_THRESHOLD: ${IDENTITY_FAILURE_THRESHOLD:-3}
      IDENTITY_RECOVERY_THRESHOLD: ${IDENTITY_RECOVERY_THRESHOLD:-3}
      IDENTITY_APPROVAL_TTL_SECONDS: ${IDENTITY_APPROVAL_TTL_SECONDS:-900}
      HTTP_PROXY: http://datacenter-router-egress:3128
      HTTPS_PROXY: http://datacenter-router-egress:3128
      NO_PROXY: keycloak,keycloak-db,gitea,reverse-dr-control-plane,.reverse-dr.svc.cluster.local,.svc,.cluster.local,127.0.0.1,localhost
    volumes:
      - ./:/workspace:ro
      - management-kubeconfig:/root/.kube:ro
      - identity-data:/var/lib/identity
    networks:
      rete-datacenter:
    depends_on:
      keycloak:
        condition: service_healthy
      datacenter-router-egress:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/lib/identity/status.json"]
      interval: 5s
      timeout: 2s
      retries: 12

  gitea:
    image: gitea/gitea:1.22.6
    container_name: gitea
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__DOMAIN: gitea
      GITEA__server__ROOT_URL: http://gitea:3000/
      GITEA__server__SSH_DOMAIN: gitea
      GITEA__server__SSH_PORT: "22"
      GITEA__server__START_SSH_SERVER: "false"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA_ADMIN_USER: ${GITEA_ADMIN_USER:-dradmin}
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD:?Definire GITEA_ADMIN_PASSWORD nel file .env}
      GITEA_ADMIN_EMAIL: ${GITEA_ADMIN_EMAIL:-dradmin@example.invalid}
    volumes:
      - gitea-data:/data
    networks:
      - rete-datacenter
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  gitea-init:
    image: gitea/gitea:1.22.6
    container_name: gitea-init
    restart: "no"
    user: git
    environment:
      GITEA_ADMIN_USER: ${GITEA_ADMIN_USER:-dradmin}
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD:?Definire GITEA_ADMIN_PASSWORD nel file .env}
      GITEA_ADMIN_EMAIL: ${GITEA_ADMIN_EMAIL:-dradmin@example.invalid}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        while [ ! -f /data/gitea/conf/app.ini ]; do sleep 2; done;
        gitea admin user create \
          --config /data/gitea/conf/app.ini \
          --username "$${GITEA_ADMIN_USER}" \
          --password "$${GITEA_ADMIN_PASSWORD}" \
          --email "$${GITEA_ADMIN_EMAIL}" \
          --admin --must-change-password=false 2>/dev/null || \
        gitea admin user change-password \
          --config /data/gitea/conf/app.ini \
          --username "$${GITEA_ADMIN_USER}" \
          --password "$${GITEA_ADMIN_PASSWORD}" \
          --must-change-password=false
    volumes:
      - gitea-data:/data
    networks:
      - rete-datacenter
    depends_on:
      gitea:
        condition: service_healthy

  keycloak:
    image: alpine/socat
    container_name: keycloak
    restart: unless-stopped
    environment:
      EXTERNAL_KEYCLOAK_IP: ${EXTERNAL_KEYCLOAK_IP:?Definire EXTERNAL_KEYCLOAK_IP nel file .env per instradare il traffico}
    command: >
      sh -c '
      socat TCP-LISTEN:8080,fork,reuseaddr TCP:$$EXTERNAL_KEYCLOAK_IP:8080 &
      socat TCP-LISTEN:9000,fork,reuseaddr TCP:$$EXTERNAL_KEYCLOAK_IP:9000 &
      wait
      '
    networks:
      rete-datacenter:
        ipv4_address: ${DATACENTER_KEYCLOAK_IP:-172.28.30.20} #FORSE E' nella DMZ
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 10s

  iac-management:
    build:
      context: .
      dockerfile: automazione/iac-management/Dockerfile
    container_name: iac-management
    init: true
    working_dir: /workspace
    command: ["sleep", "infinity"]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-west-1}
      HTTP_PROXY: http://datacenter-router-egress:3128
      HTTPS_PROXY: http://datacenter-router-egress:3128
      NO_PROXY: gitea,keycloak,reverse-dr-control-plane,.svc,.cluster.local,127.0.0.1,localhost
    volumes:
      - ./:/workspace
    networks:
      - rete-datacenter
    depends_on:
      - datacenter-router-egress

  cluster-management:
    build:
      context: .
      dockerfile: automazione/cluster-management/Dockerfile
    container_name: cluster-management
    init: true
    working_dir: /workspace
    command: ["sleep", "infinity"]
    environment:
      GITEA_ADMIN_USER: ${GITEA_ADMIN_USER:-dradmin}
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD:?Definire GITEA_ADMIN_PASSWORD nel file .env}
      GITEA_REPOSITORY: ${GITEA_REPOSITORY:-reverse-dr-poc}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Definire MINIO_ROOT_PASSWORD nel file .env}
      DATACENTER_KEYCLOAK_IP: ${DATACENTER_KEYCLOAK_IP:-172.28.30.20}
      ENTRA_ID_ISSUER_URL: ${ENTRA_ID_ISSUER_URL:-https://login.microsoftonline.com/common/v2.0}
      ENTRA_ID_CLIENT_ID: ${ENTRA_ID_CLIENT_ID:-poc-entra-client}
      ENTRA_ID_CLIENT_SECRET: ${ENTRA_ID_CLIENT_SECRET:-poc-entra-secret}
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL:-http://keycloak-datacenter.reverse-dr.svc.cluster.local:8080/realms/master}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-reverse-dr-app}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-poc-keycloak-secret}
      DR_DB_USER: ${DR_DB_USER:-reverse_dr}
      DR_DB_PASSWORD: ${DR_DB_PASSWORD:?Definire DR_DB_PASSWORD nel file .env}
      DR_DB_NAME: ${DR_DB_NAME:-reverse_dr}
      KUBECONFIG: /root/.kube/config
      HTTP_PROXY: http://datacenter-router-egress:3128
      HTTPS_PROXY: http://datacenter-router-egress:3128
      NO_PROXY: gitea,keycloak,reverse-dr-control-plane,.svc,.cluster.local,127.0.0.1,localhost
    volumes:
      - ./:/workspace
      - management-kubeconfig:/root/.kube

      - identity-data:/var/lib/identity-control
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - rete-datacenter
    depends_on:
      gitea-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      datacenter-router-egress:
        condition: service_started

volumes:
  gitea-data:
  management-kubeconfig:
  identity-data:

networks:
  rete-dipendenti:
    name: rete-dipendenti
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.10.0/24
  rete-dmz:
    name: rete-dmz
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.20.0/24
  rete-datacenter:
    name: rete-datacenter
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.30.0/24
  rete-transito-cloud:
    name: rete-transito-cloud
    driver: bridge
    internal: false
