apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: reverse-dr
spec:
  replicas: 1
  selector:
    matchLabels: { app: minio }
  template:
    metadata:
      labels: { app: minio, zone: sovereign }
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-12-18T13-15-44Z
          args: ["server", "/data", "--console-address", ":9001"]
          ports: [{ containerPort: 9000 }, { containerPort: 9001 }]
          env:
            - { name: MINIO_ROOT_USER, valueFrom: { secretKeyRef: { name: reverse-dr-secrets, key: MINIO_ROOT_USER } } }
            - { name: MINIO_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: reverse-dr-secrets, key: MINIO_ROOT_PASSWORD } } }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts: [{ name: data, mountPath: /data }]
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: reverse-dr
spec:
  selector: { app: minio }
  ports:
    - { name: api, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bootstrap
  namespace: reverse-dr
spec:
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: { app: minio-bootstrap, zone: sovereign }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-bucket
          image: minio/mc:RELEASE.2024-11-21T17-21-54Z
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do sleep 2; done
              mc mb --ignore-existing local/reverse-dr
          env:
            - { name: MINIO_ROOT_USER, valueFrom: { secretKeyRef: { name: reverse-dr-secrets, key: MINIO_ROOT_USER } } }
            - { name: MINIO_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: reverse-dr-secrets, key: MINIO_ROOT_PASSWORD } } }
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
