apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: reverse-dr
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres, zone: sovereign }
    spec:
      containers:
        - name: postgres
          image: postgres:16.4-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, valueFrom: { secretKeyRef: { name: reverse-dr-secrets, key: DR_DB_USER } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: reverse-dr-secrets, key: DR_DB_PASSWORD } } }
            - { name: POSTGRES_DB, valueFrom: { secretKeyRef: { name: reverse-dr-secrets, key: DR_DB_NAME } } }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: reverse-dr
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]

