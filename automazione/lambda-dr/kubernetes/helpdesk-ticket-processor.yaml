apiVersion: v1
kind: ConfigMap
metadata:
  name: lambda-helpdesk-ticket-processor-code
  namespace: lambda-dr
  labels:
    app.kubernetes.io/name: lambda-helpdesk-ticket-processor
    app.kubernetes.io/part-of: reverse-dr-lambda-platform
data:
  app.py: |
    from __future__ import annotations

    import base64
    import json
    from datetime import datetime, timezone
    from typing import Any


    def handler(event: dict[str, Any], context: Any) -> dict[str, Any]:
        raw_body = event.get("body") or "{}"
        if event.get("isBase64Encoded"):
            raw_body = base64.b64decode(raw_body).decode("utf-8")
        ticket = json.loads(raw_body)
        return {
            "statusCode": 200,
            "headers": {"content-type": "application/json"},
            "body": json.dumps(
                {
                    "eventType": "ticket.process",
                    "ticketId": ticket.get("id"),
                    "provider": "lambda-dr",
                    "runtime": "lambda-rie-onprem",
                    "requestId": event.get("requestContext", {}).get("requestId"),
                    "processedAt": datetime.now(timezone.utc).isoformat(),
                }
            ),
        }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lambda-helpdesk-ticket-processor
  namespace: lambda-dr
  labels:
    app.kubernetes.io/name: lambda-helpdesk-ticket-processor
    app.kubernetes.io/part-of: reverse-dr-lambda-platform
    lambda-dr/function-name: helpdesk-ticket-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lambda-helpdesk-ticket-processor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lambda-helpdesk-ticket-processor
        app.kubernetes.io/part-of: reverse-dr-lambda-platform
        lambda-dr/function-name: helpdesk-ticket-processor
        lambda-dr/runtime: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runtime
          image: reverse-dr/lambda-runtime:python3.11
          imagePullPolicy: IfNotPresent
          ports:
            - name: rie
              containerPort: 8080
          env:
            - name: AWS_REGION
              value: eu-west-1
            - name: AWS_DEFAULT_REGION
              value: eu-west-1
            - name: AWS_LAMBDA_FUNCTION_NAME
              value: helpdesk-ticket-processor
            - name: AWS_LAMBDA_FUNCTION_MEMORY_SIZE
              value: "512"
            - name: AWS_LAMBDA_FUNCTION_VERSION
              value: "$LATEST"
          readinessProbe:
            tcpSocket:
              port: rie
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: rie
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: function-code
              mountPath: /var/task
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: function-code
          configMap:
            name: lambda-helpdesk-ticket-processor-code
            defaultMode: 0444
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: lambda-helpdesk-ticket-processor
  namespace: lambda-dr
  labels:
    app.kubernetes.io/name: lambda-helpdesk-ticket-processor
    app.kubernetes.io/part-of: reverse-dr-lambda-platform
    lambda-dr/function-name: helpdesk-ticket-processor
spec:
  selector:
    app.kubernetes.io/name: lambda-helpdesk-ticket-processor
  ports:
    - name: rie
      port: 8080
      targetPort: rie

