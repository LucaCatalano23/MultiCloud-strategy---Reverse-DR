apiVersion: v1
kind: ConfigMap
metadata:
  name: lambda-orders-code
  namespace: lambda-dr
  labels:
    app.kubernetes.io/name: lambda-orders
    app.kubernetes.io/part-of: reverse-dr-lambda-platform
data:
  app.py: |
    from __future__ import annotations

    import json
    from typing import Any


    def handler(event: dict[str, Any], context: Any) -> dict[str, Any]:
        return {
            "statusCode": 200,
            "headers": {"content-type": "application/json"},
            "body": json.dumps(
                {
                    "function": "orders",
                    "method": event.get("httpMethod"),
                    "path": event.get("path"),
                    "source": (event.get("queryStringParameters") or {}).get("source"),
                    "requestId": event.get("requestContext", {}).get("requestId"),
                }
            ),
        }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lambda-orders
  namespace: lambda-dr
  labels:
    app.kubernetes.io/name: lambda-orders
    app.kubernetes.io/part-of: reverse-dr-lambda-platform
    lambda-dr/function-name: orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lambda-orders
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lambda-orders
        app.kubernetes.io/part-of: reverse-dr-lambda-platform
        lambda-dr/function-name: orders
        lambda-dr/runtime: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runtime
          image: reverse-dr/lambda-runtime:python3.11
          imagePullPolicy: IfNotPresent
          ports:
            - name: rie
              containerPort: 8080
          env:
            - name: AWS_REGION
              value: eu-west-1
            - name: AWS_DEFAULT_REGION
              value: eu-west-1
            - name: AWS_LAMBDA_FUNCTION_NAME
              value: orders
            - name: AWS_LAMBDA_FUNCTION_MEMORY_SIZE
              value: "512"
            - name: AWS_LAMBDA_FUNCTION_VERSION
              value: "$LATEST"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: rie
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: rie
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: function-code
              mountPath: /var/task
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: function-code
          configMap:
            name: lambda-orders-code
            defaultMode: 0444
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: lambda-orders
  namespace: lambda-dr
  labels:
    app.kubernetes.io/name: lambda-orders
    app.kubernetes.io/part-of: reverse-dr-lambda-platform
    lambda-dr/function-name: orders
spec:
  selector:
    app.kubernetes.io/name: lambda-orders
  ports:
    - name: rie
      port: 8080
      targetPort: rie
