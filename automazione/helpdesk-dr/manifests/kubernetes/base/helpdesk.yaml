apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpdesk-api
  namespace: helpdesk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: helpdesk-api
  template:
    metadata:
      labels:
        app: helpdesk-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: helpdesk-api
          image: reverse-dr/helpdesk-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: helpdesk-postgres
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: helpdesk-postgres
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: helpdesk-postgres
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres.helpdesk.svc.cluster.local:5432/$(POSTGRES_DB)
            - name: SITE_ROLE
              valueFrom:
                configMapKeyRef:
                  name: helpdesk-site
                  key: SITE_ROLE
            - name: SITE_NAME
              valueFrom:
                configMapKeyRef:
                  name: helpdesk-site
                  key: SITE_NAME
            - name: DR_READY_POLICY
              valueFrom:
                configMapKeyRef:
                  name: helpdesk-site
                  key: DR_READY_POLICY
            - name: DR_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: helpdesk-site
                  key: DR_ACTIVE
            - name: AUTOMATION_MODE
              valueFrom:
                configMapKeyRef:
                  name: helpdesk-automation
                  key: AUTOMATION_MODE
            - name: AWS_ENDPOINT_URL
              valueFrom:
                configMapKeyRef:
                  name: helpdesk-automation
                  key: AWS_ENDPOINT_URL
                  optional: true
            - name: AWS_REGION
              value: eu-west-1
            - name: AWS_ACCESS_KEY_ID
              value: test
            - name: AWS_SECRET_ACCESS_KEY
              value: test
            - name: LAMBDA_DR_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: helpdesk-automation
                  key: LAMBDA_DR_BASE_URL
                  optional: true
            - name: HELPDESK_LAMBDA_FUNCTION_NAME
              value: helpdesk-ticket-processor
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 8
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: helpdesk-api
  namespace: helpdesk
spec:
  selector:
    app: helpdesk-api
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: helpdesk
  namespace: helpdesk
spec:
  rules:
    - host: helpdesk.azienda.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: helpdesk-api
                port:
                  number: 80
