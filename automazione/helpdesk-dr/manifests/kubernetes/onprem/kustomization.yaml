# Overlay on-prem del solo data layer condiviso.
#
# Il monolite `helpdesk-api` e il suo overlay cloud sono stati rimossi: l'unico
# applicativo della PoC e' ora Helios (`infra/onprem`). Qui resta il PostgreSQL
# su cui vive anche il database dedicato `helios`, quindi l'overlay non e'
# ridondante nonostante non deployi piu' alcuna applicazione.
resources:
  - ../base/namespace.yaml
  - ../base/postgres.yaml
