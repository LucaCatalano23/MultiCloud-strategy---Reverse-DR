resources:
  - ../base/namespace.yaml
  - ../base/postgres.yaml
  - ../base/helpdesk.yaml

configMapGenerator:
  - name: helpdesk-site
    namespace: helpdesk
    literals:
      - SITE_ROLE=primary
      - SITE_NAME=cloud-sim
      - DR_READY_POLICY=always
  - name: helpdesk-app-source
    namespace: helpdesk
    files:
      - main.py=app/main.py
      - requirements.txt=app/requirements.txt
