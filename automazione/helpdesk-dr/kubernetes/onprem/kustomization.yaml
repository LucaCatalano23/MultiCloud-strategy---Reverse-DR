resources:
  - ../base/namespace.yaml
  - ../base/postgres.yaml
  - ../base/helpdesk.yaml

configMapGenerator:
  - name: helpdesk-site
    namespace: helpdesk
    literals:
      - SITE_ROLE=standby
      - SITE_NAME=on-prem
      - DR_READY_POLICY=marker
  - name: helpdesk-app-source
    namespace: helpdesk
    files:
      - main.py=app/main.py
      - requirements.txt=app/requirements.txt
