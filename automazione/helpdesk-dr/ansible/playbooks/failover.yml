---
- name: Orchestrate reverse DR from the Ansible control node
  hosts: dr_coordinator
  gather_facts: true
  any_errors_fatal: true
  vars:
    project_root: /opt/helpdesk-dr
    helios_dr_namespace: helios-desk
    helios_identity_namespace: helios-identity
    helios_dr_workloads:
      - helios-ticket-service
      - helios-automation-service
      - helios-bff
      - helios-web
    helios_dr_active_replicas: 1
    helios_dr_standby_replicas: 0
    # Il preflight OpenBao gira SUL nodo vault via 127.0.0.1 (cert locale), non
    # da ansible-node via rete: cosi' non dipende dalla risoluzione DNS ne' dal
    # CA distribuito fuori dal nodo. ansible-node ha il client lxd verso l'host.
    helios_vault_node: vault-openbao
    helios_keycloak_issuer: https://auth.azienda.lan/realms/helios-desk
    helios_keycloak_audience: api://reverse-dr-helpdesk
    helios_keycloak_jwks_url: http://keycloak.helios-identity.svc.cluster.local:8080/realms/helios-desk/protocol/openid-connect/certs

  pre_tasks:
    - name: Enforce the dedicated DR coordinator
      ansible.builtin.assert:
        that:
          - ansible_facts.hostname == "ansible-node"
        fail_msg: "The failover playbook must run on ansible-node."

    - name: Read current DR state
      ansible.builtin.command:
        argv:
          - bash
          - -lc
          - "source scripts/common/lib.sh && read_dr_state"
        chdir: "{{ project_root }}"
      register: dr_state
      changed_when: false

    - name: Require the atomic promoting state set by the failover wrapper
      ansible.builtin.assert:
        that:
          - dr_state.stdout | trim == "promoting"
        fail_msg: "Failover must hold the shared lock and enter promoting state first."

    # L'RTO pubblicato in dashboard e' misurato, non dichiarato: il cronometro
    # parte qui e si ferma dopo lo switch DNS. Copre restore + preflight +
    # promozione + DNS, NON il tempo di rilevamento del guasto.
    - name: Start the measured failover stopwatch
      ansible.builtin.command:
        argv:
          - date
          - "+%s"
      register: helios_failover_started_at
      changed_when: false

  tasks:
    - name: Restore and validate the standby data plane
      block:
        - name: Restore the latest verified S3 backup on-prem
          ansible.builtin.command:
            argv:
              - bash
              - scripts/restore/restore-onprem.sh
              - "{{ backup_key | default('') }}"
            chdir: "{{ project_root }}"
          changed_when: true

        - name: Verify the on-prem Lambda DR runtime
          ansible.builtin.command:
            argv:
              - bash
              - scripts/failover/verify-lambda-dr.sh
            chdir: "{{ project_root }}"
          changed_when: false

        # Preflight OpenBao PRIMA di scalare i workload e di toccare il DNS: se
        # il vault e' sigillato o irraggiungibile, External Secrets non riesce a
        # materializzare i Secret e i pod restano bloccati in
        # CreateContainerConfigError. Promuovere in quello stato sposterebbe il
        # traffico su un sito che non puo' servire nulla, quindi qui si fallisce
        # e il rescue riporta tutto a replicas 0. `bao status` esce 0 se
        # dissigillato, 2 se sigillato, 1 se irraggiungibile.
        - name: Verify that OpenBao is reachable and unsealed
          ansible.builtin.command:
            argv:
              - lxc
              - exec
              - "{{ helios_vault_node }}"
              - --
              - env
              - BAO_ADDR=https://127.0.0.1:8200
              - BAO_CACERT=/etc/openbao/tls/tls.crt
              - /usr/local/bin/bao
              - status
          changed_when: false

        - name: Promote on-prem workloads with Keycloak and switch authoritative DNS
          ansible.builtin.command:
            argv:
              - bash
              - scripts/failover/promote-onprem.sh
            chdir: "{{ project_root }}"
          environment:
            HELIOS_DR_NAMESPACE: "{{ helios_dr_namespace }}"
            HELIOS_IDENTITY_NAMESPACE: "{{ helios_identity_namespace }}"
            HELIOS_DR_WORKLOADS: "{{ helios_dr_workloads | join(' ') }}"
            HELIOS_DR_ACTIVE_REPLICAS: "{{ helios_dr_active_replicas | string }}"
            HELIOS_KEYCLOAK_ISSUER: "{{ helios_keycloak_issuer }}"
            HELIOS_KEYCLOAK_AUDIENCE: "{{ helios_keycloak_audience }}"
            HELIOS_KEYCLOAK_JWKS_URL: "{{ helios_keycloak_jwks_url }}"
          changed_when: true

        - name: Stop the measured failover stopwatch
          ansible.builtin.command:
            argv:
              - date
              - "+%s"
          register: helios_failover_finished_at
          changed_when: false

        # La registrazione della metrica non deve mai far fallire un failover
        # gia' riuscito: se il database non e' raggiungibile la dashboard mostra
        # "non disponibile", che e' l'esito onesto, e il task successivo lo
        # rende comunque visibile nell'output del playbook.
        - name: Record the measured failover duration for the dashboard
          ansible.builtin.command:
            argv:
              - bash
              - scripts/failover/record-dr-telemetry.sh
              - failover.last_promotion
              - "{{ (helios_failover_finished_at.stdout | int) - (helios_failover_started_at.stdout | int) }}"
              - >-
                {"playbook":"failover.yml","site":"onprem",
                "scope":"restore+identity-preflight+promotion+dns"}
            chdir: "{{ project_root }}"
          environment:
            HELIOS_DR_NAMESPACE: "{{ helios_dr_namespace }}"
          register: helios_failover_telemetry
          changed_when: helios_failover_telemetry.rc == 0
          failed_when: false

        - name: Warn when the failover duration could not be published
          ansible.builtin.debug:
            msg: >-
              Failover completato ma la metrica RTO non e' stata registrata
              (rc={{ helios_failover_telemetry.rc }}). La dashboard mostrera'
              l'RTO come non disponibile.
          when: helios_failover_telemetry.rc != 0

      rescue:
        # A command can be interrupted after changing workloads or DNS but
        # before returning success. Without a durable phase marker, automatic
        # demotion would be an unsafe guess; the wrapper records `reconcile`
        # and blocks every retry until an operator verifies both sites.
        - name: Stop and require reconciliation of the ambiguous transition
          ansible.builtin.fail:
            msg: >-
              Restore, identity preflight, or workload promotion failed.
              The wrapper will enter reconcile state; inspect DNS and both
              sites before any retry or cutback.
