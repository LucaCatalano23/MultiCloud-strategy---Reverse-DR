name: reverse-dr-aws-cloud

services:
  localstack:
    container_name: reverse-dr-localstack
    build:
      context: .
      dockerfile: Dockerfile
      args:
        LOCALSTACK_BASE_IMAGE: ${LOCALSTACK_IMAGE:-localstack/localstack-pro:latest}
    image: reverse-dr/localstack-cloud:local
    ports:
      - "0.0.0.0:4566:4566"
      - "0.0.0.0:4510-4559:4510-4559"
      - "0.0.0.0:8081:8081"
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?Set LOCALSTACK_AUTH_TOKEN to activate LocalStack for AWS}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-west-1}
      AWS_REGION: ${AWS_REGION:-eu-west-1}
      DEBUG: ${LOCALSTACK_DEBUG:-0}
      DISABLE_EVENTS: ${LOCALSTACK_DISABLE_EVENTS:-1}
      LOCALSTACK_EKS_API_ENABLED: ${LOCALSTACK_EKS_API_ENABLED:-false}
      EKS_K8S_PROVIDER: local
      EKS_START_K3D_LB_INGRESS: "0"
      PERSISTENCE: "1"
      SERVICES: ${LOCALSTACK_SERVICES:-ec2,iam,lambda,s3,sts}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.state/data:/var/lib/localstack
      - ./.state/cloud-kubeconfig:/root/.kube/config:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    restart: unless-stopped
