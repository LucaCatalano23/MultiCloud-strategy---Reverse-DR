apiVersion: apps/v1
kind: Deployment
metadata:
  name: terna-static-web
  namespace: terna-static-dr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: terna-static-web
  template:
    metadata:
      labels:
        app: terna-static-web
    spec:
      securityContext:
        fsGroup: 101
      containers:
        - name: static-web
          image: nginx:1.27-alpine
          imagePullPolicy: Never
          command: ["nginx", "-g", "daemon off;"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: static-data
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - test -s /usr/share/nginx/html/current/index.html && test -s /usr/share/nginx/html/current/manifest.json && test -f /usr/share/nginx/html/current/.bundle-v1 && test -s /usr/share/nginx/html/current/dr/load-chart/index.html && test -s /usr/share/nginx/html/current/dr/load-chart/data.json && (test -f /usr/share/nginx/html/current/dr/load-chart/.load-chart-v1 || test -f /usr/share/nginx/html/current/dr/load-chart/.load-chart-placeholder-v1)
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 101
            runAsGroup: 101
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: static-data
          hostPath: { path: /srv/terna-static-dr/static, type: DirectoryOrCreate }
        - name: nginx-config
          configMap: { name: terna-static-nginx-config }
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
