apiVersion: v1
kind: ConfigMap
metadata:
  name: terna-static-nginx-config
  namespace: terna-static-dr
data:
  default.conf: |
    server {
      listen 8080;
      server_name terna.it www.terna.it;
      root /usr/share/nginx/html/current;
      index index.html;
      location = /health {
        default_type text/plain;
        return 200 'ok';
      }
      location = / {
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
      }
      location = /it {
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
      }
      location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
      }
      location ~* /css$ {
        default_type text/css;
        try_files $uri =404;
      }
      location ~* /js$ {
        default_type application/javascript;
        try_files $uri =404;
      }
      location ~* \.(?:css|js|mjs|json|woff2?|ttf|svg|png|jpe?g|gif|webp|ico)$ {
        try_files $uri =404;
      }
      location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html =404;
      }
    }
