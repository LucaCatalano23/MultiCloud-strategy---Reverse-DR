events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 80 default_server;
        server_name _;

        location = /load-balancer-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"up","component":"datacenter-load-balancer"}\n';
        }

        location / {
            return 444;
        }
    }

    include /etc/nginx/conf.d/*.conf;
}
