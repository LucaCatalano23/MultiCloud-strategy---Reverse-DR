apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-bff-secrets
  namespace: helios-desk
spec:
  provider:
    aws:
      service: SecretsManager
      region: REPLACE_AWS_REGION
      auth:
        jwt:
          serviceAccountRef:
            name: helios-bff
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: helios-bff-database
  namespace: helios-desk
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-bff-secrets
    kind: SecretStore
  target:
    name: helios-bff-database
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: REPLACE_APPLICATION_DATABASE_SECRET_ARN
        property: DATABASE_URL
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: helios-bff-runtime
  namespace: helios-desk
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-bff-secrets
    kind: SecretStore
  target:
    name: helios-bff-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: REPLACE_APPLICATION_CONFIG_SECRET_ARN
        property: OIDC_CLIENT_SECRET
    - secretKey: SESSION_ENCRYPTION_KEY
      remoteRef:
        key: REPLACE_APPLICATION_CONFIG_SECRET_ARN
        property: SESSION_ENCRYPTION_KEY
---
