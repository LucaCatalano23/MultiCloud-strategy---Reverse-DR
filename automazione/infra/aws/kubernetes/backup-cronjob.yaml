apiVersion: batch/v1
kind: CronJob
metadata:
  name: helios-postgres-backup
  namespace: helios-desk
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: helios-postgres-backup
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          serviceAccountName: helios-postgres-backup
          automountServiceAccountToken: true
          nodeSelector:
            reverse-dr.io/failure-domain: primary-az
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              # Must contain compatible pg_dump AND psql, gzip/coreutils and AWS
              # CLI v2. psql is required to publish the RPO metric consumed by
              # the dashboard: the job that produced the backup is the only
              # component entitled to state when it actually succeeded.
              image: helios-postgres-backup:cloud-placeholder
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  stamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  backup_file="/work/postgres-${stamp}.dump"
                  checksum_file="${backup_file}.sha256"
                  pg_dump_url="$(printf '%s' "$DATABASE_URL" | sed 's#^postgresql+asyncpg:#postgresql:#')"

                  pg_dump \
                    --dbname="$pg_dump_url" \
                    --format=custom \
                    --compress=9 \
                    --no-owner \
                    --no-acl \
                    --file="$backup_file"
                  sha256sum "$backup_file" >"$checksum_file"

                  object_prefix="s3://${BACKUP_S3_BUCKET}/postgres/${stamp}"
                  aws s3 cp "$backup_file" "${object_prefix}.dump" --only-show-errors
                  aws s3 cp "$checksum_file" "${object_prefix}.dump.sha256" --only-show-errors

                  # Da qui in poi il backup e' completo e verificabile su S3:
                  # solo ora ha senso dichiararlo come "ultimo backup riuscito".
                  # Registrarlo prima dell'upload farebbe misurare un RPO che il
                  # sito DR non potrebbe realmente rispettare.
                  psql "$pg_dump_url" -v ON_ERROR_STOP=1 \
                    -v object="${object_prefix}.dump" <<'SQL'
                  INSERT INTO dr_telemetry (metric, recorded_at, duration_seconds, detail)
                  VALUES (
                    'backup.last_success',
                    now(),
                    NULL,
                    jsonb_build_object('object', :'object', 'site', 'aws-primary')
                  )
                  ON CONFLICT (metric) DO UPDATE
                    SET recorded_at = EXCLUDED.recorded_at,
                        detail = EXCLUDED.detail;
                  SQL
                  unset pg_dump_url DATABASE_URL
              envFrom:
                - configMapRef:
                    name: helios-aws-config
              env:
                # aws-cli scrive in ~/.aws (config/cache) ma la root fs e'
                # read-only: HOME punta alla emptyDir scrivibile /tmp, altrimenti
                # l'upload S3 fallisce con "Read-only file system: .../.aws".
                - name: HOME
                  value: /tmp
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: helios-backup-database
                      key: DATABASE_URL
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: work
              emptyDir:
                sizeLimit: 2Gi
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
