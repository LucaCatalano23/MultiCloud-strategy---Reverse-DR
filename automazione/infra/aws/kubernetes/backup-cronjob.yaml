apiVersion: batch/v1
kind: CronJob
metadata:
  name: helios-postgres-backup
  namespace: helios-desk
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: helios-postgres-backup
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          serviceAccountName: helios-postgres-backup
          automountServiceAccountToken: true
          nodeSelector:
            reverse-dr.io/failure-domain: primary-az
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              # Must contain compatible pg_dump, gzip/coreutils and AWS CLI v2.
              image: helios-postgres-backup:cloud-placeholder
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  stamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  backup_file="/work/postgres-${stamp}.dump"
                  checksum_file="${backup_file}.sha256"
                  pg_dump_url="$(printf '%s' "$DATABASE_URL" | sed 's#^postgresql+asyncpg:#postgresql:#')"

                  pg_dump \
                    --dbname="$pg_dump_url" \
                    --format=custom \
                    --compress=9 \
                    --no-owner \
                    --no-acl \
                    --file="$backup_file"
                  sha256sum "$backup_file" >"$checksum_file"

                  object_prefix="s3://${BACKUP_S3_BUCKET}/postgres/${stamp}"
                  aws s3 cp "$backup_file" "${object_prefix}.dump" --only-show-errors
                  aws s3 cp "$checksum_file" "${object_prefix}.dump.sha256" --only-show-errors
                  unset pg_dump_url DATABASE_URL
              envFrom:
                - configMapRef:
                    name: helios-aws-config
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: helios-backup-database
                      key: DATABASE_URL
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: work
              emptyDir:
                sizeLimit: 2Gi
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
