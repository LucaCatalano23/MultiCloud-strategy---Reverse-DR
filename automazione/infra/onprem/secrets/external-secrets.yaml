# Consumo dei segreti nel sito DR: stesso meccanismo del sito primario.
#
# Sul primario gli stessi Secret sono materializzati da External Secrets
# Operator con provider `aws.SecretsManager` e autenticazione IRSA
# (infra/aws/kubernetes/external-secrets.yaml). Qui cambia solo il backend:
# provider `vault` verso OpenBao, autenticazione tramite ServiceAccount
# Kubernetes. I Deployment non cambiano di una riga: continuano a montare
# `helios-app-database`, `helios-bff-runtime`, `keycloak-postgres` e gli altri
# esattamente come prima, perche' il contratto e' il nome del Secret, non la sua
# origine.
#
# Differenza dichiarata rispetto al primario: su AWS la granularita' e' per
# workload (ogni pod ha il proprio ruolo IRSA), qui e' per namespace. IRSA lega
# il permesso al singolo ServiceAccount applicativo senza intermediari, mentre
# qui il fetch lo esegue il controller ESO, non il pod: una granularita' per
# workload darebbe l'illusione di un isolamento che il controller non ha.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: helios-secrets-sync
  namespace: helios-desk
  labels:
    app.kubernetes.io/part-of: helios-desk
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: helios-secrets-sync
  namespace: helios-identity
  labels:
    app.kubernetes.io/part-of: helios-desk
automountServiceAccountToken: false
---
# OpenBao valida i token dei ServiceAccount tramite la TokenReview API: serve un
# account autorizzato a effettuare quella chiamata. E' l'unico privilegio
# concesso, e non consente di leggere Secret ne' di impersonare alcuno.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-token-reviewer
  namespace: helios-desk
  labels:
    app.kubernetes.io/part-of: helios-desk
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbao-token-reviewer
  labels:
    app.kubernetes.io/part-of: helios-desk
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: openbao-token-reviewer
    namespace: helios-desk
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-application
  namespace: helios-desk
spec:
  provider:
    vault:
      # OpenBao e' compatibile con l'API di HashiCorp Vault: ESO usa lo stesso
      # provider. Il mount e' KV v2, come sul percorso `helios/data/...` delle
      # policy in infra/vault/policies.
      #
      # IP diretto del nodo vault-openbao, non l'hostname: CoreDNS del cluster
      # non inoltra la zona azienda.lan a server-dns, quindi `vault.azienda.lan`
      # non e' risolvibile da dentro k3s. L'IP e' statico nella topologia DR e il
      # certificato include IP:10.10.3.80 nei SAN, quindi il TLS resta valido e il
      # percorso segreti non dipende dal DNS del cluster. In produzione, con il
      # DNS aziendale integrato nel cluster, qui tornerebbe l'hostname.
      server: https://10.10.3.80:8200
      path: helios
      version: v2
      caProvider:
        type: ConfigMap
        name: openbao-ca
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: helios-desk
          serviceAccountRef:
            name: helios-secrets-sync
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-identity
  namespace: helios-identity
spec:
  provider:
    vault:
      # IP diretto del nodo vault-openbao: vedi la nota estesa nello SecretStore
      # openbao-application. CoreDNS non risolve vault.azienda.lan dentro k3s.
      server: https://10.10.3.80:8200
      path: helios
      version: v2
      caProvider:
        type: ConfigMap
        name: openbao-ca
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: helios-identity
          serviceAccountRef:
            name: helios-secrets-sync
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: helios-app-database
  namespace: helios-desk
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-application
    kind: SecretStore
  target:
    name: helios-app-database
    creationPolicy: Owner
    # Retain: se l'ExternalSecret viene rimosso per errore durante un DR, il
    # Secret gia' materializzato resta e i pod non cadono. Stessa scelta del
    # lato AWS.
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: onprem/application/database
        property: DATABASE_URL
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: helios-bff-runtime
  namespace: helios-desk
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-application
    kind: SecretStore
  target:
    name: helios-bff-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: onprem/application/bff-runtime
        property: OIDC_CLIENT_SECRET
    - secretKey: SESSION_ENCRYPTION_KEY
      remoteRef:
        key: onprem/application/bff-runtime
        property: SESSION_ENCRYPTION_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: helios-app-tls
  namespace: helios-desk
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-application
    kind: SecretStore
  target:
    name: helios-app-tls
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      # L'Ingress accetta solo Secret di tipo kubernetes.io/tls: senza questo
      # template ESO produrrebbe un Opaque e Traefik ignorerebbe il certificato.
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: onprem/application/tls
        property: tls.crt
    - secretKey: tls.key
      remoteRef:
        key: onprem/application/tls
        property: tls.key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-postgres
  namespace: helios-identity
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-identity
    kind: SecretStore
  target:
    name: keycloak-postgres
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: POSTGRES_DB
      remoteRef:
        key: onprem/identity/keycloak-postgres
        property: POSTGRES_DB
    - secretKey: POSTGRES_USER
      remoteRef:
        key: onprem/identity/keycloak-postgres
        property: POSTGRES_USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: onprem/identity/keycloak-postgres
        property: POSTGRES_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-bootstrap-admin
  namespace: helios-identity
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-identity
    kind: SecretStore
  target:
    name: keycloak-bootstrap-admin
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: username
      remoteRef:
        key: onprem/identity/keycloak-bootstrap-admin
        property: username
    - secretKey: password
      remoteRef:
        key: onprem/identity/keycloak-bootstrap-admin
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: helios-bff-oidc
  namespace: helios-identity
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-identity
    kind: SecretStore
  target:
    name: helios-bff-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: onprem/identity/bff-oidc
        property: OIDC_CLIENT_SECRET
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: helios-dr-operator
  namespace: helios-identity
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-identity
    kind: SecretStore
  target:
    name: helios-dr-operator
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: username
      remoteRef:
        key: onprem/identity/dr-operator
        property: username
    - secretKey: password
      remoteRef:
        key: onprem/identity/dr-operator
        property: password
    - secretKey: employee_id
      remoteRef:
        key: onprem/identity/dr-operator
        property: employee_id
    - secretKey: email
      remoteRef:
        key: onprem/identity/dr-operator
        property: email
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: helios-identity-tls
  namespace: helios-identity
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-identity
    kind: SecretStore
  target:
    name: helios-identity-tls
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: onprem/identity/tls
        property: tls.crt
    - secretKey: tls.key
      remoteRef:
        key: onprem/identity/tls
        property: tls.key
