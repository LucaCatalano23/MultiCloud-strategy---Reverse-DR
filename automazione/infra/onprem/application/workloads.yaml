apiVersion: apps/v1
kind: Deployment
metadata:
  name: helios-web
  namespace: helios-desk
  labels:
    app.kubernetes.io/name: helios-web
    app.kubernetes.io/component: web
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: helios-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: helios-web
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: reverse-dr/helios-desk-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: runtime-config
              mountPath: /usr/share/nginx/html/config
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: runtime-config
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
        - name: nginx-cache
          emptyDir:
            sizeLimit: 32Mi
        - name: nginx-run
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
        - name: nginx-conf
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: helios-web
  namespace: helios-desk
  labels:
    app.kubernetes.io/name: helios-web
spec:
  selector:
    app.kubernetes.io/name: helios-web
  ports:
    - name: http
      port: 8080
      targetPort: http
