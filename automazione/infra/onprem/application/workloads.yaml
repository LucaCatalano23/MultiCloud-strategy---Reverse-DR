apiVersion: apps/v1
kind: Deployment
metadata:
  name: helios-ticket-service
  namespace: helios-desk
  labels:
    app.kubernetes.io/name: helios-ticket-service
    app.kubernetes.io/component: ticket-api
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: helios-ticket-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: helios-ticket-service
        app.kubernetes.io/component: ticket-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ticket-service
          image: helios-ticket-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: helios-app-database
                  key: DATABASE_URL
            - name: DR_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: helios-onprem-config
                  key: DR_ACTIVE
            - name: OIDC_ISSUER_URL
              valueFrom:
                configMapKeyRef:
                  name: helios-onprem-config
                  key: OIDC_ISSUER_URL
            - name: OIDC_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: helios-onprem-config
                  key: OIDC_AUDIENCE
            - name: OIDC_JWKS_URL
              valueFrom:
                configMapKeyRef:
                  name: helios-onprem-config
                  key: OIDC_JWKS_URL
            - name: OIDC_ROLES_CLAIM
              valueFrom:
                configMapKeyRef:
                  name: helios-onprem-config
                  key: OIDC_ROLES_CLAIM
            - name: OIDC_REQUIRED_ALGORITHMS
              valueFrom:
                configMapKeyRef:
                  name: helios-onprem-config
                  key: OIDC_REQUIRED_ALGORITHMS
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: helios-ticket-service
  namespace: helios-desk
  labels:
    app.kubernetes.io/name: helios-ticket-service
spec:
  selector:
    app.kubernetes.io/name: helios-ticket-service
  ports:
    - name: http
      port: 8001
      targetPort: http
---
