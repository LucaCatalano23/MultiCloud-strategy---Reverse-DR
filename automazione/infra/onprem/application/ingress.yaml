apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: helios-desk
  namespace: helios-desk
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # No explicit router.priority: Traefik auto-computes priority per rule from
    # match specificity, so /api, /health and /dr-status naturally outrank the
    # catch-all "/" rule within this same Ingress. Forcing a single priority
    # value applies it uniformly to every rule in the object, which collapses
    # that specificity ordering and made "/" win non-deterministically for
    # more specific paths too.
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - helpdesk.azienda.lan
      secretName: helios-app-tls
  rules:
    - host: helpdesk.azienda.lan
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: helios-bff
                port:
                  name: http
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: helios-bff
                port:
                  name: http
          - path: /dr-status
            pathType: Exact
            backend:
              service:
                name: helios-bff
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: helios-web
                port:
                  name: http
