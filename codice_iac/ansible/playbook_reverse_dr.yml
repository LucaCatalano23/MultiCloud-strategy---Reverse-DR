---
- name: Attiva il sito on-premise in Island Mode
  hosts: on_premise
  gather_facts: false
  vars:
    manifest_dir: "{{ playbook_dir }}/../../kubernetes"
    app_image: "{{ lookup('env', 'APP_IMAGE') | default('reverse-dr-app:local', true) }}"
    minio_user: "{{ lookup('env', 'MINIO_ROOT_USER') }}"
    minio_password: "{{ lookup('env', 'MINIO_ROOT_PASSWORD') }}"
    datacenter_keycloak_ip: "{{ lookup('env', 'DATACENTER_KEYCLOAK_IP') | default('172.28.30.20', true) }}"
    db_user: "{{ lookup('env', 'DR_DB_USER') }}"
    db_password: "{{ lookup('env', 'DR_DB_PASSWORD') }}"
    db_name: "{{ lookup('env', 'DR_DB_NAME') }}"
    entra_issuer_url: "{{ lookup('env', 'ENTRA_ID_ISSUER_URL') }}"
    entra_client_id: "{{ lookup('env', 'ENTRA_ID_CLIENT_ID') }}"
    entra_client_secret: "{{ lookup('env', 'ENTRA_ID_CLIENT_SECRET') }}"

  pre_tasks:
    - name: Verifica che i segreti obbligatori siano valorizzati
      ansible.builtin.assert:
        that:
          - minio_user | length > 0
          - minio_password | length >= 12
          - db_password | length >= 12
          - datacenter_keycloak_ip is match('^(?:[0-9]{1,3}\\.){3}[0-9]{1,3}$')
          - entra_issuer_url | length > 0
          - entra_client_id | length > 0
          - entra_client_secret | length > 0
        fail_msg: "Definire credenziali DR robuste nel file .env del bastion."

    - name: Verifica la raggiungibilità del cluster
      kubernetes.core.k8s_cluster_info:
        kubeconfig: "{{ kubeconfig }}"

  tasks:
    - name: Crea il namespace DR
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        src: "{{ manifest_dir }}/namespace.yml"

    - name: Inietta i segreti runtime senza salvarli nel repository
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: reverse-dr-secrets
            namespace: reverse-dr
          type: Opaque
          stringData:
            MINIO_ROOT_USER: "{{ minio_user }}"
            MINIO_ROOT_PASSWORD: "{{ minio_password }}"
            DR_DB_USER: "{{ db_user }}"
            DR_DB_PASSWORD: "{{ db_password }}"
            DR_DB_NAME: "{{ db_name }}"
      no_log: true
      register: runtime_secret

    - name: Verifica la configurazione identity corrente
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: v1
        kind: ConfigMap
        namespace: reverse-dr
        name: identity-provider-active
      register: identity_config

    - name: Inizializza Entra ID come provider primario
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: identity-provider-active
            namespace: reverse-dr
          data:
            IDP_PROVIDER: entra
            IDP_ISSUER_URL: "{{ entra_issuer_url }}"
      when: identity_config.resources | length == 0

    - name: Verifica le credenziali identity correnti
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: v1
        kind: Secret
        namespace: reverse-dr
        name: identity-provider-credentials
      register: identity_credentials
      no_log: true

    - name: Inizializza le credenziali Entra ID
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: identity-provider-credentials
            namespace: reverse-dr
          type: Opaque
          stringData:
            IDP_CLIENT_ID: "{{ entra_client_id }}"
            IDP_CLIENT_SECRET: "{{ entra_client_secret }}"
      when: identity_credentials.resources | length == 0
      no_log: true

    - name: Rimuove il bootstrap MinIO se le credenziali sono cambiate
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: absent
        api_version: batch/v1
        kind: Job
        namespace: reverse-dr
        name: minio-bootstrap
      when: runtime_secret.changed

    - name: Distribuisce i servizi sovrani on-premise
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        src: "{{ item }}"
      loop:
        - "{{ manifest_dir }}/postgres.yml"
        - "{{ manifest_dir }}/minio.yml"

    - name: Riavvia i servizi dati se le credenziali sono cambiate
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: patched
        api_version: apps/v1
        kind: Deployment
        namespace: reverse-dr
        name: "{{ item }}"
        definition:
          spec:
            template:
              metadata:
                annotations:
                  reverse-dr.local/credentials-reloaded-at: "{{ lookup('pipe', 'date +%s') }}"
      loop: [postgres, minio]
      when: runtime_secret.changed

    - name: Attende la disponibilità dei servizi dati e trust
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: apps/v1
        kind: Deployment
        namespace: reverse-dr
        name: "{{ item }}"
        wait: true
        wait_condition:
          type: Available
          status: "True"
        wait_timeout: 300
      loop: [postgres, minio]

    - name: Rimuove il Keycloak legacy dal cluster DR
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: absent
        api_version: "{{ item.api_version }}"
        kind: "{{ item.kind }}"
        namespace: reverse-dr
        name: keycloak
      loop:
        - { api_version: apps/v1, kind: Deployment }
        - { api_version: v1, kind: Service }

    - name: Registra Keycloak datacenter come dipendenza esterna del cluster
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition: "{{ lookup('template', manifest_dir + '/datacenter-keycloak-service.yml.j2') | from_yaml_all | list }}"

    - name: Attende la creazione del bucket locale
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: batch/v1
        kind: Job
        namespace: reverse-dr
        name: minio-bootstrap
        wait: true
        wait_condition:
          type: Complete
          status: "True"
        wait_timeout: 180

    - name: Attiva applicazione e policy Island Mode
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition: "{{ lookup('template', item) | from_yaml_all | list }}"
      loop:
        - "{{ manifest_dir }}/app.yml.j2"
        - "{{ manifest_dir }}/island-mode-network-policy.yml.j2"
